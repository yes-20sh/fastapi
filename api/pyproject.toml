[project]
name = "fastapi-backend"
version = "0.1.0"
description = "Modular FastAPI backend with feature-based modules and centralized SQLAlchemy models"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi[standard]>=0.115",
    "sqlalchemy>=2.0",
    "email-validator>=2.0",
    "pyjwt>=2.8",
    "pwdlib[argon2]>=0.2",
    "alembic>=1.13",
]

[project.scripts]
api = "app.server:start"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
    "ruff>=0.6",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[build-system]
requires = ["uv_build>=0.12.2,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "app"
module-root = ""
namespace = true




